<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写真アップロード</title>
</head>
<body>

  <h2>写真アップロード</h2>

  <div>
    <label>
      担当者名：
      <input type="text" id="staff" placeholder="山田">
    </label>
  </div>

  <div>
    <label>
      現場名：
      <input type="text" id="site" placeholder="〇〇ビル">
    </label>
  </div>

  <div>
    <input type="file" id="photos" multiple accept="image/*">
  </div>

  <div>
    <button onclick="send()">送信</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
